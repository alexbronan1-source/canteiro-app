<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFC21A">
<meta name="description" content="Canteiro: orçamentos, gestão de obras, diário de obra, clientes e controle financeiro para profissionais da construção.">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/icon-512.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Canteiro">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>:root{color-scheme:light}body{margin:0}
/* Alertas em fluxo normal: cartão compacto, sem altura artificial. */
.card.alerts-summary, section.card.alerts-summary {
  display:block !important; position:relative !important; inset:auto !important;
  height:auto !important; min-height:0 !important; max-height:none !important;
  flex:0 0 auto !important; flex-grow:0 !important; align-self:stretch !important;
  justify-self:stretch !important; grid-row:auto !important; grid-column:1 / -1 !important;
  padding:12px !important; margin:12px 0 !important; overflow:visible !important;
}
.card.alerts-summary > * { position:static !important; inset:auto !important; transform:none !important;
  height:auto !important; min-height:0 !important; max-height:none !important; flex:none !important; }
.card.alerts-summary > .sechead { display:flex !important; align-items:center !important; justify-content:space-between !important; gap:8px; margin:0 0 8px !important; }
.card.alerts-summary > .hint { margin:0 0 8px !important; }
.card.alerts-summary > .alerts { display:flex !important; flex-direction:column !important; gap:8px !important; margin:0 0 8px !important; }
.card.alerts-summary > .kpi-sub { margin:0 !important; }
.card.alerts-summary .pill { position:static !important; }
</style>
</head>
<body>
<title>Canteiro · Orçamentos e gestão de obras</title>
<meta name="description" content="Orçamentos profissionais, gestão de obras, clientes e financeiro para profissionais da construção.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Archivo+Black&display=swap">
<style>
/* Layout: coluna única de app de celular, cabeçalho com faixa de obra (amarelo/preto), abas fixas embaixo. */
:root{
  --bg:#F1EFE9; --panel:#FFFFFF; --ink:#1F2428; --muted:#5E636A; --line:#DDD9CF; --soft:#E9E6DD;
  --yellow:#FFC21A; --yellow-soft:#FFF3CF; --on-yellow:#1F2428;
  --orange:#E0560A; --green:#1E9A43; --on-green:#FFFFFF; --red:#C0392B; --red-soft:#F9E3DF; --green-soft:#DDF3E3;
  --paper:#FFFFFF; --paper-ink:#1F2428; --paper-muted:#5E636A; --paper-line:#DDD9CF; --paper-soft:#F1EFE9; --paper-head:#1F2428; --paper-head-ink:#FFFFFF;
  --display:'Archivo Black','Arial Black',Impact,sans-serif;
  --body:'Archivo',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14171A; --panel:#1E2327; --ink:#F1EFE9; --muted:#A3A8AD; --line:#333A40; --soft:#272D32;
  --yellow-soft:#3A3213; --orange:#FF8A3D; --green:#2DB757; --red:#F0705F; --red-soft:#3A2220; --green-soft:#17301F; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14171A; --panel:#1E2327; --ink:#F1EFE9; --muted:#A3A8AD; --line:#333A40; --soft:#272D32;
  --yellow-soft:#3A3213; --orange:#FF8A3D; --green:#2DB757; --red:#F0705F; --red-soft:#3A2220; --green-soft:#17301F; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;padding-inline:16px;padding-block:0 96px;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;line-height:1.1;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:25px}
h2{font-size:17px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.wrap{max-width:640px;margin-inline:auto}

/* masthead */
.mast{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);margin-inline:-16px;padding-inline:16px}
.mast::before{content:"";display:block;height:7px;margin-inline:-16px;background:repeating-linear-gradient(135deg,var(--yellow) 0 12px,#1F2428 12px 24px)}
.mast-in{max-width:640px;margin-inline:auto;display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--display);font-size:19px}
.brand svg{width:28px;height:28px;padding:4px;background:var(--yellow);color:var(--on-yellow);border-radius:8px}
.status{font-size:12px;color:var(--muted);text-align:right}
.status.err{color:var(--red)}

main{max-width:640px;margin-inline:auto;display:flex;flex-direction:column;gap:14px;padding-block:6px 0}
.titlerow{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.sub{color:var(--muted);margin:0}

.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card>h2{display:flex;align-items:center;justify-content:space-between;gap:8px}
.hint{font-size:13px;color:var(--muted);margin:0}

.note{background:var(--yellow-soft);border:1px solid var(--yellow);border-radius:12px;padding:10px 12px;font-size:13.5px}
.note.ok{background:var(--green-soft);border-color:var(--green)}
.note.warn{background:var(--red-soft);border-color:var(--red)}
.link{background:none;border:0;padding:0;text-decoration:underline;font-weight:600}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
@media (max-width:440px){.grid3{grid-template-columns:1fr 1fr}.grid3 .span3{grid-column:1/-1}}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f>span{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
input[type=text],input[type=number],input[type=tel],input[type=date],select,textarea{width:100%;min-height:44px;padding:9px 11px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--yellow);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--yellow) 45%,transparent)}
textarea{min-height:70px;resize:vertical}
input[type=range]{width:100%;accent-color:var(--orange)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:9px 16px;border-radius:12px;border:1.5px solid var(--ink);background:var(--panel);font-weight:700;text-decoration:none;color:var(--ink)}
.btn svg{width:18px;height:18px;flex:none}
.btn.sm{min-height:36px;padding:5px 12px;font-size:13.5px;border-radius:10px}
.btn.primary{background:var(--green);border-color:var(--green);color:var(--on-green);box-shadow:0 3px 0 color-mix(in srgb,var(--green) 60%,#000);font-family:var(--display);font-weight:400;letter-spacing:.02em;text-transform:uppercase;min-height:52px}
.btn.primary:active{transform:translateY(2px);box-shadow:0 1px 0 color-mix(in srgb,var(--green) 60%,#000)}
.btn.wa{border-color:var(--green);color:var(--green)}
.btn.ghost{border-color:var(--line);background:transparent}
.btn.danger{border-color:var(--red);color:var(--red)}
.btn.block{width:100%}
.btn.yellow{background:var(--yellow);border-color:var(--yellow);color:var(--on-yellow)}
.btn[aria-disabled=true]{opacity:.5;pointer-events:none}
.icon-btn{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:10px;border:1.5px solid var(--line);background:transparent;flex:none}
.icon-btn svg{width:18px;height:18px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1 1 auto}

.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;margin-inline:-2px;padding-inline:2px;scrollbar-width:thin}
.chip{flex:none;min-height:38px;padding:6px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--panel);font-weight:600;font-size:13.5px}
.chip.on{background:var(--yellow);border-color:var(--yellow);color:var(--on-yellow)}
.chip.dash{border-style:dashed;color:var(--muted)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border:1.5px solid var(--line);border-radius:12px;padding:3px;gap:3px;background:var(--bg)}
.seg button{border:0;background:transparent;border-radius:9px;min-height:38px;font-weight:700;font-size:13.5px;padding:4px 8px}
.seg button.on{background:var(--ink);color:var(--bg)}

/* picker */
.svcgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.svc{text-align:left;padding:9px 11px;border-radius:11px;border:1.5px solid var(--line);background:var(--bg);display:flex;flex-direction:column;gap:2px;min-width:0}
.svc b{font-size:13.5px;font-weight:600;line-height:1.25}
.svc small{color:var(--muted);font-size:12px}
.svc.on{border-color:var(--yellow);background:var(--yellow-soft)}
.tiers{background:var(--bg);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:6px;border:1px solid var(--line)}
.tier{display:grid;grid-template-columns:74px 1fr auto;align-items:center;gap:10px;padding:7px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--panel);text-align:left;width:100%}
.tier .tn{font-size:11.5px;font-weight:800;letter-spacing:.06em;color:var(--muted)}
.tier .bar{height:9px;border-radius:99px;background:var(--soft);overflow:hidden}
.tier .bar i{display:block;height:100%;background:var(--orange);border-radius:99px}
.tier .tp{font-family:var(--display);color:var(--orange);font-size:16px;white-space:nowrap;font-variant-numeric:tabular-nums}
.tier .tp small{font-family:var(--body);font-weight:600;color:var(--muted);font-size:11px}
.tier.on{border-color:var(--yellow);background:var(--yellow-soft)}
.tier.on .tn{color:var(--ink)}

/* lines */
.line{border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.line-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.line-name{font-weight:700;min-width:0}
.line-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:8px;align-items:end}
.line-grid .amt{font-family:var(--display);font-size:16px;text-align:right;white-space:nowrap;padding-bottom:10px;font-variant-numeric:tabular-nums}
.empty{border:2px dashed var(--line);border-radius:12px;padding:18px;text-align:center;color:var(--muted)}
.exec-task{border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:9px;background:var(--bg)}
.exec-task.overdue{border-color:var(--red);background:var(--red-soft)}
.exec-task-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.exec-task-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.exec-task-grid input,.exec-task-grid select{min-height:38px;font-size:13px}
.exec-kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.exec-kpi{padding:10px;border-radius:10px;background:var(--bg);border:1px solid var(--line)}
.exec-kpi small{display:block;color:var(--muted);font-size:11px}
.exec-kpi b{display:block;font-size:18px;font-variant-numeric:tabular-nums}


/* totals */
.total-card{background:#1F2428;color:#F1EFE9;border:1px solid #3A4148;border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.total-card .rows{display:flex;flex-direction:column;gap:4px;font-size:13.5px;opacity:.85}
.total-card .rows div{display:flex;justify-content:space-between;gap:10px;font-variant-numeric:tabular-nums}
.total{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.tl{font-weight:800;letter-spacing:.08em;font-size:13px}
.tv{font-family:var(--display);font-size:32px;color:var(--yellow);font-variant-numeric:tabular-nums;line-height:1.1}
.pace{font-size:13px;border-radius:10px;padding:8px 10px;background:rgba(255,255,255,.1)}
.pace.bad{background:#C0392B;color:#fff}
.pace.ok{background:#1E9A43;color:#fff}

/* lists and tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile span{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tile b{font-family:var(--display);font-weight:400;font-size:19px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.tile.hot b{color:var(--orange)}
.tile.neg b{color:var(--red)}
.pill{display:inline-block;font-size:11.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:3px 9px;border-radius:99px;background:var(--soft);color:var(--ink)}
.pill.aguardando,.pill.planejada{background:var(--yellow-soft);box-shadow:inset 0 0 0 1.5px var(--yellow)}
.pill.aprovado,.pill.concluida{background:var(--green-soft);color:var(--green)}
.pill.andamento{background:var(--yellow);color:var(--on-yellow)}
.pill.recusado,.pill.pausada{background:var(--red-soft);color:var(--red)}
.pill.ex{background:transparent;box-shadow:inset 0 0 0 1.5px var(--muted);color:var(--muted)}
.item{display:flex;flex-direction:column;gap:8px}
.item-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.item-top>div{min-width:0}
.item .big{font-family:var(--display);font-size:19px;white-space:nowrap;font-variant-numeric:tabular-nums}
.item .meta{font-size:13px;color:var(--muted)}
.progress{height:10px;border-radius:99px;background:var(--soft);overflow:hidden}
.progress i{display:block;height:100%;background:var(--yellow);border-radius:99px}
.mini{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.mini:first-of-type{border-top:0}
.mini .v{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.mini>span:first-child{min-width:0;overflow-wrap:anywhere}
.task{display:flex;gap:10px;align-items:center;padding:6px 0}
.task input{width:22px;height:22px;accent-color:var(--green);flex:none}
.task.done span{text-decoration:line-through;color:var(--muted)}
.task span{flex:1;min-width:0;overflow-wrap:anywhere}
details.card>summary{cursor:pointer;font-family:var(--display);font-size:17px;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.card>summary::-webkit-details-marker{display:none}
details.card>*+*{margin-top:12px}
details.card>.hint{margin-top:10px}
details.card>summary::after{content:"+";font-size:22px}
details.card[open]>summary::after{content:"−"}
.pricerow{display:grid;grid-template-columns:minmax(0,1fr) 120px;gap:10px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.pricerow small{display:block;color:var(--muted)}
.pricerow input{min-height:38px}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--panel);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs-in{max-width:760px;margin-inline:auto;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:2px}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:transparent;border-radius:10px;padding:6px 0;font-size:10.5px;font-weight:700;color:var(--muted);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-width:380px){.tab{font-size:9.5px}.tab svg{width:20px;height:20px}}
.tab svg{width:22px;height:22px}
.tab.on{color:var(--ink);background:var(--yellow-soft);box-shadow:inset 0 -3px 0 var(--yellow)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;z-index:40;max-width:calc(100% - 32px);text-align:center}
.back{align-self:flex-start}

/* documento do orçamento (folha de papel: igual nos dois temas) */
.docbox{overflow-x:auto;border-radius:12px}
.doc{background:var(--paper);color:var(--paper-ink);border:1px solid var(--paper-line);border-radius:12px;overflow:hidden;font-family:var(--body);font-size:13px;min-width:0}
.doc .tw{overflow-x:auto}
.doc table{min-width:380px}
.doc *{box-sizing:border-box}
.doc .dh{background:var(--paper-head);color:var(--paper-head-ink);padding:14px 16px;display:flex;align-items:center;gap:12px;justify-content:space-between;border-bottom:4px solid var(--yellow)}
.doc .who{display:flex;align-items:center;gap:12px;min-width:0}
.doc .ini{width:42px;height:42px;border-radius:50%;border:2px solid #fff;display:grid;place-items:center;font-weight:700;font-size:14px;flex:none}
.doc .nm{font-family:var(--display);font-size:17px;line-height:1.1}
.doc .tr{font-size:12px;opacity:.85}
.doc .wa{background:#25D366;color:#fff;border-radius:8px;padding:6px 10px;font-weight:700;font-size:12px;white-space:nowrap}
.doc .db{padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.doc .no{display:flex;justify-content:space-between;gap:10px;align-items:flex-end;border-bottom:1px solid var(--paper-line);padding-bottom:10px}
.doc .no b{font-family:var(--display);font-size:16px;font-weight:400}
.doc .no small{display:block;text-align:right;color:var(--paper-muted)}
.doc .lb{font-size:10.5px;font-weight:800;letter-spacing:.08em;color:var(--paper-muted);text-transform:uppercase}
.doc .tot{border:1.5px solid var(--paper-ink);border-radius:10px;padding:10px 12px;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px}
.doc .tot b.v{font-family:var(--display);font-weight:400;font-size:26px;white-space:nowrap}
.doc .tot .t1{font-weight:800;font-size:11px;letter-spacing:.07em}
.doc .tot .t2{font-weight:800;font-size:12px}
.doc table{width:100%;border-collapse:collapse;font-size:12px}
.doc th{background:var(--paper-soft);text-align:left;padding:5px 7px;font-size:10.5px;color:var(--paper-muted);border:1px solid var(--paper-line)}
.doc td{padding:5px 7px;border:1px solid var(--paper-line)}
.doc td.r,.doc th.r{text-align:right;white-space:nowrap}
.doc .sumline{display:flex;justify-content:space-between;gap:10px;padding:2px 0}
.doc .grand{background:var(--paper-head);color:var(--paper-head-ink);border-radius:8px;padding:8px 12px;display:flex;justify-content:space-between;align-items:center;font-weight:800}
.doc .grand b{font-family:var(--display);font-weight:400;font-size:19px}
.doc .box{background:var(--paper-soft);border-radius:8px;padding:8px 10px;font-size:12px;color:var(--paper-ink)}
.doc .sign{display:grid;grid-template-columns:1fr 1fr;gap:20px;padding-top:22px}
.doc .sign div{border-top:1px solid var(--paper-ink);padding-top:4px;font-size:11px;color:var(--paper-muted)}
.doc .sec{display:flex;justify-content:space-between;align-items:baseline;font-weight:800}
.doc .ex{background:#FFF3CF;border:1px dashed #E0A800;color:#1F2428;text-align:center;font-weight:700;font-size:11px;padding:4px;letter-spacing:.06em}
.doc .logo{height:44px;width:auto;max-width:96px;background:#fff;border-radius:8px;padding:3px;object-fit:contain;flex:none}
.brandprev{display:flex;align-items:center;gap:12px;padding:12px 14px}
.brandprev img{height:44px;width:auto;max-width:96px;background:#fff;border-radius:8px;padding:3px;object-fit:contain}
.brandprev .ini{width:42px;height:42px;border-radius:50%;border:2px solid;display:grid;place-items:center;font-weight:700;font-size:14px;flex:none}
.brandprev b{display:block;font-family:var(--display);font-weight:400;font-size:16px;line-height:1.15}
.brandprev small{display:block;font-size:12px;opacity:.85}
input[type=search]{-webkit-appearance:none;appearance:none}
input[type=color]{width:100%;min-height:44px;padding:3px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);cursor:pointer}
.chip.swatch{width:40px;padding:0;border-color:var(--line);font-weight:800}
.doc .stripe{height:7px}
.doc .co{font-size:11px;color:var(--paper-muted);line-height:1.5}
.doc .cond{border:1px solid var(--paper-line);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:3px;font-size:12px}
.doc .cd{display:grid;grid-template-columns:104px minmax(0,1fr);gap:8px}

function justoRaw(s,ctx){if(s.own)return s.base;const o=num(state.settings.overrides[s.id]);if(o>0)return o;return bxBase(s)*(UF[ctx.uf]||1)*(SIZES[ctx.size]?SIZES[ctx.size].f:1)*idxFactor()}

function calc(b){
  let sub=0,days=0;
  b.lines.forEach(l=>{const q=num(l.qty);sub+=q*unitOf(l,b);const s=bxSvc(l.svc);if(s&&s.prod)days+=q/s.prod});
  const pct=ADJ.filter(a=>b.adj.includes(a[0])).reduce((t,a)=>t+a[2],0);
  const adjV=r2(sub*pct/100);const labor=r2(sub+adjV);const mat=b.mat?num(b.matValue):0;

}

  ${state.clients.length?state.clients.map(c=>{const n=state.budgets.filter(b=>b.clientId===c.id).length;let p=String(c.phone||'').replace(/\D/g,'');if(p&&p.length<=11)p='55'+p;return`<article class="card item">
    <div class="grid2"><label class="f"><span>Nome</span><input type="text" value="${esc(c.name)}" data-bind="clients.${c.id}.name"></label><label class="f"><span>WhatsApp</span><input type="tel" inputmode="tel" value="${esc(c.phone)}" data-bind="clients.${c.id}.phone" placeholder="(00) 00000-0000"></label></div>

    <button class="btn sm ${ui.confirm==='c'+c.id?'danger':'ghost'}" data-a="del" data-kind="c" data-id="${c.id}">${ui.confirm==='c'+c.id?'Confirmar?':'Excluir'}</button></div></article>`}).join(''):`<div class="empty">Nenhum cliente. Eles também são criados quando você salva um orçamento com nome novo.</div>`}`;

function idxTileHTML(){
  const x=state.settings.idx||{},f=idxFactor(),pct=r2((f-1)*100);
  if(!x.type||x.type==='none')return `<span>Reajuste aplicado</span><b>nenhum</b>`;
  return `<span>Reajuste aplicado</span><b>${pct>0?'+':''}${qtyf(pct)}%</b>`;
}
function sec(id,title,body,note){
  return`<details class="card" data-sec="${id}"${ui.open[id]?' open':''}><summary>${title}</summary>${note?`<p class="hint">${note}</p>`:''}${body}</details>`;
}

 alv:{name:'Blocos e argamassa de assentamento',short:'Blocos',def:{comp:'12',alt:'2,8',vaos:'3,6',perda:'8',bloco:'c14x29'},

  }},
 piso:{name:'Piso e revestimento',short:'Piso',def:{area:'30',comp:'60',larg:'60',junta:'3',esp:'9',perda:'10',cx:'2',col:'m'},

  calc(v){

   const caixas=bxUp(A*(1+pd)/cx),rej=(C>0&&W>0)?(C+W)/(C*W)*num(v.junta)*num(v.esp)*1.7*A:0;
   return{lines:[{k:'cx',name:'Piso (caixa de '+qtyf(cx)+' m²)',qty:caixas,unit:'caixa'},{k:'col',name:'Argamassa colante (saco de 20 kg)',qty:bxUp(A*col.kg/20),unit:'saco'},{k:'rej',name:'Rejunte',qty:A>0?Math.max(1,bxUp(rej)):0,unit:'kg'}],

 tinta:{name:'Tinta',short:'Tinta',def:{area:'90',vaos:'6',demaos:'2',rend:'10'},

  calc(v){
   const A=Math.max(0,num(v.area)-num(v.vaos)),d=Math.max(1,num(v.demaos)),r=Math.max(1,num(v.rend)),L=A*d/r;
   let n18=Math.floor(L/18),n36=L-n18*18>0.0001?bxUp((L-n18*18)/3.6):0;if(n36>=5){n18++;n36=0}
   const lines=[];if(n18>0)lines.push({k:'t18',name:'Tinta, lata de 18 litros',qty:n18,unit:'lata'});if(n36>0||!lines.length)lines.push({k:'t36',name:'Tinta, galão de 3,6 litros',qty:n36,unit:'galão'});

 conc:{name:'Concreto',short:'Concreto',def:{comp:'1,2',larg:'1,2',esp:'40',qtd:'6',perda:'5',tr:'c123'},

function bxApplyUpdate(o){
  if(!o||typeof o!=='object'||Array.isArray(o))throw new Error('formato');
  const prec={};let np=0;
  if(o.precos&&typeof o.precos==='object')Object.keys(o.precos).forEach(k=>{const v=Number(o.precos[k]);if(SVC[k]&&isFinite(v)&&v>0&&v<1e6){prec[k]=r2(v);np++}});
  const add=[];
  if(Array.isArray(o.servicos))o.servicos.slice(0,100).forEach(x=>{
    if(!x||typeof x!=='object')return;
    const nm=String(x.nome||'').trim().slice(0,80),un=BX_UNITS.includes(x.unidade)?x.unidade:'un',pr=Number(x.preco);
    const id='up_'+String(x.id||nm).toLowerCase().replace(/[^a-z0-9]+/g,'').slice(0,24);
    if(!nm||!isFinite(pr)||pr<=0||pr>=1e6||id==='up_')return;
    add.push({id,name:nm,unit:un,base:r2(pr),prod:Math.max(0,Math.min(1000,Number(x.producao)||0)),up:true});
  });
  if(!np&&!add.length)throw new Error('vazio');
  const st=state.settings;
  st.pu={ver:String(o.versao||'').slice(0,20),date:String(o.data||'').slice(0,20),precos:Object.assign({},(st.pu&&st.pu.precos)||{},prec)};
  add.forEach(a=>{const i=st.custom.findIndex(c=>c.id===a.id);if(i>=0)st.custom[i]=Object.assign({},st.custom[i],a);else st.custom.push(a)});
  return{np,ns:add.length};
}

function executionDashboardHTML(ps){
 const today=new Date();today.setHours(0,0,0,0);
 const tasks=ps.flatMap(p=>(p.tasks||[]).map(t=>({p,t})));
 const isDone=t=>!!t.done||num(t.progress)>=100;
 const dueDate=t=>{if(!t.due)return null;const m=/^(\d{4})-(\d\d)-(\d\d)$/.exec(t.due);return m?new Date(+m[1],+m[2]-1,+m[3]):null};
 const overdue=tasks.filter(x=>!isDone(x.t)&&dueDate(x.t)&&dueDate(x.t)<today);
 const dueSoon=tasks.filter(x=>{const d=dueDate(x.t);return !isDone(x.t)&&d&&d>=today&&d<=new Date(today.getFullYear(),today.getMonth(),today.getDate()+7)});
 const avg=tasks.length?Math.round(tasks.reduce((n,x)=>n+(isDone(x.t)?100:Math.max(0,Math.min(100,num(x.t.progress)))),0)/tasks.length):0;
 const latePlanned=overdue.reduce((n,x)=>n+num(x.t.plannedCost),0);

const OB_STAGES=['Serviços preliminares e limpeza do terreno','Fundação','Estrutura','Alvenaria','Cobertura','Instalações elétricas e hidráulicas','Reboco e contrapiso','Revestimentos e pisos','Pintura','Acabamento e limpeza final'];
const OB_ST={pend:'Pendente',and:'Em andamento',ok:'Concluída'};
const obD=v=>{const m=/^(\d{4})-(\d\d)-(\d\d)$/.exec(v||'');return m?new Date(+m[1],+m[2]-1,+m[3]):null};
const obFd=v=>{const d=obD(v);return d?d.toLocaleDateString('pt-BR'):''};
const obIso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const obToday=()=>obIso(new Date());
const obAdd=(d,n)=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);return x};
function obProj(p){
  if(!Array.isArray(p.stages))p.stages=[];
  if(!p.ct||typeof p.ct!=='object')p.ct={cpf:'',inicio:'',prazo:'',multa:'2',pgto:'',extra:''};
  return p;
}
function obPj(){const p=state.projects.find(x=>x.id===ui.projectId);return p?obProj(p):null}

/* valor por extenso */
const OB_U=['zero','um','dois','três','quatro','cinco','seis','sete','oito','nove','dez','onze','doze','treze','quatorze','quinze','dezesseis','dezessete','dezoito','dezenove'];
const OB_T=['','','vinte','trinta','quarenta','cinquenta','sessenta','setenta','oitenta','noventa'];
const OB_C=['','cento','duzentos','trezentos','quatrocentos','quinhentos','seiscentos','setecentos','oitocentos','novecentos'];
function obB1000(n){
  if(n===100)return'cem';
  const c=Math.floor(n/100),r=n%100,o=[];
  if(c)o.push(OB_C[c]);
  if(r){if(r<20)o.push(OB_U[r]);else{const t=Math.floor(r/10),u=r%10;o.push(u?OB_T[t]+' e '+OB_U[u]:OB_T[t])}}
  return o.join(' e ');
}
function obInt(n){
  if(n===0)return'zero';
  const mi=Math.floor(n/1e6),th=Math.floor(n%1e6/1000),rs=n%1000,parts=[];
  if(mi)parts.push(obB1000(mi)+(mi===1?' milhão':' milhões'));
  if(th)parts.push(th===1?'mil':obB1000(th)+' mil');
  if(rs)parts.push(obB1000(rs));
  const last=rs||th;let out=parts[0];
  for(let i=1;i<parts.length;i++){out+=(i===parts.length-1&&(last<100||last%100===0)?' e ':' ')+parts[i]}
  return out;
}
function obExt(v){
  v=Math.round(num(v)*100)/100;const r=Math.floor(v),c=Math.round((v-r)*100);
  const a=r>0?obInt(r)+(r>=1e6&&r%1e6===0?' de':'')+(r===1?' real':' reais'):'';
  const b=c>0?obInt(c)+(c===1?' centavo':' centavos'):'';
  return a&&b?a+' e '+b:(a||b||'zero reais');
}

/* ---------- lucro real ---------- */
function obProfit(p){
  const t=projTotals(p),con=t.con;
  const by={};ECATS.forEach(c=>by[c]=0);
  p.expenses.forEach(x=>{const k=ECATS.includes(x.cat)?x.cat:'Outros';by[k]+=num(x.value)});
  const prev=con-t.sp,margem=con>0?prev/con*100:0;
  const spPct=con>0?t.sp/con*100:0,prog=num(p.progress);
  const b=p.budgetId?state.budgets.find(x=>x.id===p.budgetId):null;
  const cb=b?calc(b):null;
  return{t,by,prev,margem,spPct,prog,cb,b};
}
function obProfitHTML(p){
  const o=obProfit(p),t=o.t;
  if(!(t.con>0)&&!t.sp)return`<section class="card"><h2>Lucro da obra</h2><p class="hint">Digite o valor do contrato e lance as despesas para ver quanto você está ganhando de verdade.</p></section>`;
  const neg=o.prev<0,low=!neg&&t.con>0&&o.margem<20;
  const warn=t.con>0&&o.spPct>o.prog+15&&o.prog<100

/* ---------- cronograma ---------- */
function obLate(s){const e=obD(s.end);return s.st!=='ok'&&e&&e<obD(obToday())}
function obGantt(p){
  obProj(p);
  const ss=p.stages.filter(s=>obD(s.start)&&obD(s.end)&&obD(s.end)>=obD(s.start));
  if(!ss.length)return'<p class="hint">Preencha as datas de início e fim para ver o gráfico.</p>';
  const t0=Math.min(...ss.map(s=>obD(s.start).getTime())),t1=Math.max(...ss.map(s=>obD(s.end).getTime()))+864e5;
  const span=Math.max(864e5,t1-t0);const now=obD(obToday()).getTime();
  const pos=v=>Math.max(0,Math.min(100,(v-t0)/span*100));
  const col=s=>s.st==='ok'?'var(--green)':obLate(s)?'var(--red)':s.st==='and'?'var(--yellow)':'var(--muted)';
  return`<div class="obg"><div class="obg-h"><span>${obFd(obIso(new Date(t0)))}</span><span>${obFd(obIso(new Date(t1-864e5)))}</span></div>
  ${ss.map(s=>{const l=pos(obD(s.start).getTime()),w=Math.max(2,pos(obD(s.end).getTime()+864e5)-l);return`<div class="obg-r"><div class="obg-n">${esc(s.name||'Etapa')}</div><div class="obg-t">${now>=t0&&now<t1?`<i class="obg-now" style="left:${pos(now)}%"></i>`:''}<b style="left:${l}%;width:${w}%;background:${col(s)}"></b></div></div>`}).join('')}</div>`;
}

function shoppingNeeds(p){
 const planned=Array.isArray(p?.materialPlan)?p.materialPlan:[];const stock=Array.isArray(p?.stock)?p.stock:[];const groups=new Map();
 for(const m of planned){const name=String(m.name||'Material').trim(),unit=String(m.unit||'unidade').trim(),key=norm(name)+'|'+norm(unit);if(!groups.has(key))groups.set(key,{name,unit,qty:0});groups.get(key).qty+=Math.max(0,num(m.qty));}
 return [...groups.values()].map(m=>{const same=stock.filter(x=>norm(x.name)===norm(m.name)&&norm(x.unit)===norm(m.unit));const available=same.reduce((a,x)=>a+Math.max(0,num(x.qty)),0);return {...m,available,buy:Math.max(0,Math.round((m.qty-available)*100)/100),covered:available>=m.qty}});
}

function render(){
  if(!state)return;
  $('#main').innerHTML=SCREENS[ui.tab]();
  $('#tabs').innerHTML=TABS.map(t=>`<button class="tab${ui.tab===t[0]?' on':''}" data-a="tab" data-id="${t[0]}" ${ui.tab===t[0]?'aria-current="page"':''}>${ic(t[2])}${t[1]}</button>`).join('');
  if(ui.copyText){const e=$('#copyfb');if(e){e.focus();e.select()}}
  document.querySelectorAll('[data-dl]').forEach(b=>{b.hidden=!dlApi});
}
function paintTotals(){
  const d=state.draft,c=calc(d);
  document.querySelectorAll('[data-lt]').forEach(el=>{const l=d.lines.find(x=>x.id===el.dataset.lt);if(l)el.textContent=brl(num(l.qty)*unitOf(l,d))});
  const t=$('#totals');if(t)t.innerHTML=totalsHTML(d,c);
  const p=$('#preview');if(p&&ui.preview)p.innerHTML=quoteHTML(docModel(d));
}
let toastT=null;
function toast(msg){const b=$('#toastbox');b.innerHTML=`<div class="toast">${esc(msg)}</div>`;clearTimeout(toastT);toastT=setTimeout(()=>{b.innerHTML=''},2600)}

let dlApi=null;
/* fora do Claude (página publicada em um site próprio) o download comum do navegador funciona */
const anchorDl={save:async({filename,data})=>{const blob=data instanceof Blob?data:new Blob([data]);const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);return{status:'saved'}}};
function findIn(arr,id){return arr.find(x=>x.id===id)}
function setPath(path,val){
  const seg=path.split('.');let o=seg[0]==='ui'?ui:state[seg[0]];
  for(let i=1;i<seg.length-1;i++){const k=seg[i];o=Array.isArray(o)?o.find(x=>x.id===k):o[k];if(o==null)return false}
  const last=seg[seg.length-1];
  if(Array.isArray(o))return false;
  o[last]=val;return true;
}
function saveDraft(){
  const d=state.draft;
  if(!d.lines.length){toast('Adicione ao menos um serviço');return}
  const b=clone(d);
  b.lines.forEach(l=>{if(l.manual==null||l.manual==='')l.manual=unitOf(l,d)});
  if(!b.clientId&&b.clientName.trim()){const c={id:uid(),name:b.clientName.trim(),phone:'',note:''};state.clients.push(c);b.clientId=c.id}
  const old=state.budgets.find(x=>x.id===b.editing);
  delete b.ex;b.idxPct=r2((idxFactor()-1)*100);b.idxName=IDXN[state.settings.idx.type]||'';const total=calc(b).total;
  if(old){const keep={id:old.id,num:old.num,createdAt:old.createdAt,status:old.status,validity:old.validity};delete b.editing;Object.assign(old,b,keep,{total});delete old.ex}
  else{delete b.editing;Object.assign(b,{id:uid(),num:state.nextNum++,createdAt:new Date().toISOString(),status:'aguardando',validity:state.settings.validity,total});state.budgets.unshift(b)}
  state.draft=newDraft();ui.tab='list';ui.filter='todos';ui.copyText=null;ui.preview=false;ui.pk={open:false,g:0,s:-1,svc:null,qty:'',q:''};
  toast(old?'Alterações salvas':'Orçamento salvo');render();save();window.scrollTo(0,0);
}
async function copyText(text){
  try{await navigator.clipboard.writeText(text);ui.copyText=null;toast('Texto copiado');render()}
  catch(e){ui.copyText=text;render()}
}
let dlBusy=false;
const DLERR={
  rate_limited:'Já existe um pedido de download aberto. Responda a janela de confirmação e toque de novo.',
  too_large:'O arquivo ficou grande demais para baixar.',
  extension_not_enabled:'Este aparelho não permite baixar esse tipo de arquivo por aqui.',
  bad_request:'Não consegui preparar o arquivo. Tente de novo.',
  unavailable:'Este aparelho não deixa baixar arquivos por aqui. Abra o app pelo navegador (Chrome ou Safari) e tente de novo.'
};
function pdfMsgHTML(){const m=ui.pdfMsg;return m?`<div class="note ${m.k==='bad'?'warn':m.k==='ok'?'ok':''}" role="status">${esc(m.t)}</div>`:''}
function setPdfMsg(t,k){ui.pdfMsg=t?{t,k}:null;document.querySelectorAll('.pdfslot').forEach(e=>{e.innerHTML=pdfMsgHTML()})}
async function saveBlob(filename,data,okMsg){
  if(!dlApi){setPdfMsg(DLERR.unavailable,'bad');return false}
  if(dlBusy){setPdfMsg('Ainda esperando você confirmar o download na janela que abriu.','wait');return false}
  dlBusy=true;setPdfMsg(dlApi===anchorDl?'Baixando o arquivo…':'Confirme o download na janela que abriu na tela.','wait');
  try{await dlApi.save({filename,data});setPdfMsg(okMsg,'ok');return true}
  catch(e){const c=e&&e.code;setPdfMsg(c==='declined'?'Download cancelado. Toque de novo quando quiser.':(DLERR[c]||DLERR.unavailable),'bad');return false}
  finally{dlBusy=false}
}
function modelFor(id){return id==='draft'?docModel(state.draft):state.budgets.find(b=>b.id===id)}
const ACT={
  costalert(){
    const ps=state.projects.filter(p=>!p.ex&&num(p.plannedCost)>0&&projTotals(p).sp>num(p.plannedCost));
    if(!ps.length){toast('Nenhuma obra acima do custo previsto neste momento');return}

    if(ps.length>1){const menu=ps.map((x,i)=>`${i+1}. ${x.name||'Obra sem nome'} — previsto ${brl(x.plannedCost)}, gasto ${brl(projTotals(x).sp)}`).join('\n');const answer=prompt('Qual obra deseja revisar? Digite o número:\n\n'+menu,'1');if(answer===null)return;const index=Number(String(answer).trim());if(!Number.isInteger(index)||index<1||index>ps.length){toast('Número de obra inválido');return}p=ps[index-1]}
    ACT.openproj(p.id);
  },
  quickproject(id){
    const projects=state.projects.filter(p=>!p.ex);
    if(!projects.length){toast('Cadastre uma obra antes de usar o acesso rápido');return}

    if(projects.length===1)p=projects[0];
    else{
      const menu=projects.map((x,i)=>`${i+1}. ${x.name||'Obra sem nome'}`).join('\n');

      if(answer===null)return;
      const index=Number(String(answer).trim());
      if(!Number.isInteger(index)||index<1||index>projects.length){toast('Número de obra inválido');return}

    const route=routes[id];if(!route)return;
    ui.projectId=route[0]==='projects'?p.id:null;ui.managePid=p.id;ui.tab=route[0];ui.confirm=null;ui.copyText=null;render();save();
    requestAnimationFrame(()=>{const target=document.getElementById(route[1]);if(target)target.scrollIntoView({behavior:'smooth',block:'start'})});
  },
  manageproject(id,el){ui.managePid=el.value;render()},
  reportmonth(id,el){ui.reportMonth=el.value;render()},
  async diaryadd(){
    const p=state.projects.find(x=>x.id===(ui.managePid||state.projects.find(y=>!y.ex)?.id));if(!p){toast('Selecione uma obra');return}
    const date=$('#diaryDate')?.value||new Date().toISOString().slice(0,10),weather=$('#diaryWeather')?.value||'',team=$('#diaryTeam')?.value.trim()||'',notes=$('#diaryNotes')?.value.trim()||'',files=Array.from($('#diaryPhotos')?.files||[]);

    if(files.length>6){toast('Selecione no máximo 6 fotos por registro');return}
    const photos=[];
    for(const f of files.slice(0,6)){try{const data=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(f)});photos.push(await new Promise(resolve=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),scale=Math.min(1,800/Math.max(im.width,im.height));c.width=Math.round(im.width*scale);c.height=Math.round(im.height*scale);c.getContext('2d').drawImage(im,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',.58))};im.onerror=()=>resolve(data);im.src=data}))}catch(e){}}
    if(!Array.isArray(p.diary))p.diary=[];p.diary.push({id:uid(),date,weather,team,notes,photos});save();render();toast('Registro do diário salvo');

  preview(){ui.preview=!ui.preview;render()},
  copy(id){const m=modelFor(id);if(m)copyText(waText(m))},
  async pdf(id){

    if(!m.lines.length){toast('Adicione ao menos um serviço');return}
    if(dlBusy){setPdfMsg('Ainda esperando você confirmar o download na janela que abriu.','wait');return}
    let blob;try{blob=buildPdf(m)}catch(e){setPdfMsg('Não consegui montar o PDF. Tente de novo.','bad');return}
    const nm=(clientOf(m).name||'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^A-Za-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,30);
    await saveBlob('orcamento-'+numLabel(m)+(nm?'-'+nm:'')+'.pdf',blob,'PDF baixado. Agora anexe na conversa do cliente no WhatsApp.');
  },
  async sharepdf(id){
    const m=modelFor(id);if(!m)return;
    if(!m.lines.length){toast('Adicione ao menos um serviço');return}
    if(dlBusy){setPdfMsg('Ainda esperando você confirmar o download na janela que abriu.','wait');return}
    let blob;try{blob=buildPdf(m)}catch(e){setPdfMsg('Não consegui montar o PDF. Tente de novo.','bad');return}
    const nm=(clientOf(m).name||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Za-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,30);
    const fname='orcamento-'+numLabel(m)+(nm?'-'+nm:'')+'.pdf';
    let file=null,can=false;
    try{file=new File([blob],fname,{type:'application/pdf'});can=!!(navigator.canShare&&navigator.canShare({files:[file]}))}catch(e){}
    if(can){
      try{
        setPdfMsg('Escolha o WhatsApp na lista que abriu.','wait');
        await navigator.share({files:[file],text:'Orçamento nº '+numLabel(m)+' — '+state.settings.name+'. Total '+brl(calc(m).total)});
        setPdfMsg('PDF compartilhado.','ok');return;
      }catch(e){
        if(e&&e.name==='AbortError'){setPdfMsg('Envio cancelado. Toque de novo quando quiser.','');return}
      }
    }
    await saveBlob(fname,blob,'Este aparelho não anexa direto no WhatsApp a partir daqui. O PDF foi baixado: abra a conversa do cliente e anexe o arquivo.');
  },
  logoclear(){state.settings.logo=null;render();save()},
  brand(id){state.settings.brand=id;render();save()},
  filter(id){ui.filter=id;render()},
  editb(id){const b=state.budgets.find(x=>x.id===id);if(!b)return;const d=clone(b);['num','createdAt','status','total','validity','ex'].forEach(k=>delete d[k]);d.editing=b.id;if(b.ex)d.ex=true;state.draft=d;ui.tab='quote';ui.pk={open:false,g:0,s:-1,svc:null,qty:'',q:''};render();save();window.scrollTo(0,0)},
  dupb(id){const b=state.budgets.find(x=>x.id===id);if(!b)return;const d=clone(b);['num','createdAt','status','total','validity','ex','id'].forEach(k=>delete d[k]);d.id=uid();d.editing=null;d.lines.forEach(l=>{l.id=uid()});state.draft=d;ui.tab='quote';render();save();toast('Cópia aberta. Ajuste e salve.');window.scrollTo(0,0)},
  mkproj(id){
    const b=state.budgets.find(x=>x.id===id);if(!b)return;
    const p=newProject({name:b.workName||clientOf(b).name||'Nova obra',clientId:b.clientId,contract:b.total,budgetId:b.id,address:'',ex:b.ex||undefined,
      tasks:b.lines.map(l=>({id:uid(),text:`${l.name} (${qtyf(num(l.qty))} ${l.unit})`,done:false}))});
    state.projects.unshift(p);ui.tab='projects';ui.projectId=p.id;render();save();toast('Obra criada com as tarefas do orçamento');window.scrollTo(0,0)},
  openproj(id){ui.tab='projects';ui.projectId=id;ui.f={};render();window.scrollTo(0,0)},
  closeproj(){ui.projectId=null;ui.f={};render()},
  newproj(){const p=newProject();state.projects.unshift(p);ui.tab='projects';ui.projectId=p.id;ui.f={};render();save()},
  tgtask(id){const p=findIn(state.projects,ui.projectId);const t=p&&findIn(p.tasks,id);if(t){t.done=!t.done;t.progress=t.done?100:Math.min(95,Math.max(0,num(t.progress)));const n=p.tasks.length;if(n){p.progress=Math.round(p.tasks.reduce((a,x)=>a+(x.done?100:Math.max(0,Math.min(100,num(x.progress)))),0)/n/5)*5}render();save()}},
  rmtask(id){const p=findIn(state.projects,ui.projectId);p.tasks=p.tasks.filter(x=>x.id!==id);render();save()},
  addtask(){const p=findIn(state.projects,ui.projectId),t=(ui.f.task||'').trim();if(!t){toast('Escreva a tarefa');return}p.tasks.push({id:uid(),text:t,done:false,progress:0,responsible:(ui.f.taskResponsible||'').trim(),due:ui.f.taskDue||'',plannedCost:Math.max(0,num(ui.f.taskCost)),actualCost:0});ui.f.task='';ui.f.taskResponsible='';ui.f.taskDue='';ui.f.taskCost='';render();save();toast('Tarefa adicionada ao cronograma')},
  addlabor(){const p=findIn(state.projects,ui.projectId),worker=(ui.f.laborWorker||'').trim(),hours=num(ui.f.laborHours),rate=num(ui.f.laborRate);if(!worker){toast('Informe o nome do trabalhador');return}if(hours<=0){toast('Informe as horas trabalhadas');return}if(rate<0){toast('O valor por hora não pode ser negativo');return}if(!Array.isArray(p.laborLogs))p.laborLogs=[];p.laborLogs.unshift({id:uid(),worker,role:(ui.f.laborRole||'').trim(),date:ui.f.laborDate||obToday(),hours,rate,work:(ui.f.laborWork||'').trim(),createdAt:new Date().toISOString()});['laborWorker','laborRole','laborDate','laborHours','laborRate','laborWork'].forEach(k=>delete ui.f[k]);render();save();toast('Jornada registrada')},
  rmlabor(id){const p=findIn(state.projects,ui.projectId);if(!p)return;if(!confirm('Remover este registro de jornada?'))return;p.laborLogs=(p.laborLogs||[]).filter(x=>x.id!==id);render();save()},
  addissue(){const p=findIn(state.projects,ui.projectId),title=(ui.f.issueTitle||'').trim();if(!title){toast('Descreva a pendência');return}if(!Array.isArray(p.issues))p.issues=[];p.issues.unshift({id:uid(),title,category:ui.f.issueCategory||'Qualidade',priority:ui.f.issuePriority||'Normal',responsible:(ui.f.issueResponsible||'').trim(),due:ui.f.issueDue||'',note:(ui.f.issueNote||'').trim(),status:'aberta',createdAt:new Date().toISOString(),resolvedAt:null});['issueTitle','issueCategory','issuePriority','issueResponsible','issueDue','issueNote'].forEach(k=>delete ui.f[k]);render();save();toast('Pendência registrada')},
  toggleissue(id){const p=findIn(state.projects,ui.projectId),x=p&&(p.issues||[]).find(v=>v.id===id);if(!x)return;x.status=x.status==='resolvida'?'aberta':'resolvida';x.resolvedAt=x.status==='resolvida'?new Date().toISOString():null;render();save();toast(x.status==='resolvida'?'Pendência resolvida':'Pendência reaberta')},
  rmissue(id){const p=findIn(state.projects,ui.projectId);if(!p)return;if(!confirm('Remover esta pendência do histórico?'))return;p.issues=(p.issues||[]).filter(x=>x.id!==id);render();save()},
  addexp(){const p=findIn(state.projects,ui.projectId),v=num(ui.f.ev);if(v<=0){toast('Digite o valor');return}p.expenses.unshift({id:uid(),desc:(ui.f.ed||'').trim(),cat:ui.f.ec||ECATS[0],value:v,date:new Date().toISOString()});ui.f.ed='';ui.f.ev='';render();save()},
  rmexp(id){const p=findIn(state.projects,ui.projectId);p.expenses=p.expenses.filter(x=>x.id!==id);render();save()},
  addpay(){const p=findIn(state.projects,ui.projectId),v=num(ui.f.pv);if(v<=0){toast('Digite o valor');return}p.payments.unshift({id:uid(),desc:(ui.f.pd||'').trim(),value:v,date:new Date().toISOString()});ui.f.pd='';ui.f.pv='';render();save()},
  rmpay(id){const p=findIn(state.projects,ui.projectId);p.payments=p.payments.filter(x=>x.id!==id);render();save()},
  newclient(){state.clients.unshift({id:uid(),name:'',phone:'',note:''});render();save();const e=$('#main input[type=text]');if(e)e.focus()},
  clearex(){state.budgets=state.budgets.filter(b=>!b.ex);state.projects=state.projects.filter(p=>!p.ex);state.clients=state.clients.filter(c=>!c.ex);
    if(state.draft.ex||!state.clients.some(c=>c.id===state.draft.clientId)){if(state.draft.ex)state.draft=newDraft();else state.draft.clientId=''}
    render();save();toast('Exemplos apagados')},
  backup(){saveBlob('canteiro-backup-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(snapshot(),null,1),'Backup baixado.')},
  del(id,el){
    const kind=el.dataset.kind,key=kind+id;
    if(ui.confirm!==key){ui.confirm=key;render();return}
    ui.confirm=null;
    if(kind==='b')state.budgets=state.budgets.filter(b=>b.id!==id);
    if(kind==='c')state.clients=state.clients.filter(c=>c.id!==id);
    if(kind==='p'){state.projects=state.projects.filter(p=>p.id!==id);ui.projectId=null}
    if(kind==='s'){state.draft.lines.forEach(l=>{if(l.svc===id){l.manual=unitOf(l,state.draft);l.svc='custom'}});state.settings.custom=state.settings.custom.filter(c=>c.id!==id)}
    render();save();
  }
};
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');if(!el||el.type==='checkbox')return;
  const a=ACT[el.dataset.a];if(a)a(el.dataset.id,el);
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.id==='manageProject'){ui.managePid=el.value;render();return}
  if(el.id==='reportMonth'){ui.reportMonth=el.value;render();return}
  if(el.matches('input[type=checkbox][data-a]')){const a=ACT[el.dataset.a];if(a)a(el.dataset.id,el);return}
  if(el.id==='logofile'&&el.files&&el.files[0]){
    processLogo(el.files[0]).then(l=>{state.settings.logo=l;render();save();toast('Logo salva')}).catch(()=>toast('Não consegui ler essa imagem'));
    return;
  }
  if(el.id==='restore'&&el.files&&el.files[0]){
    const file=el.files[0];if(file.size>15*1024*1024){toast('Backup muito grande para restaurar neste navegador');el.value='';return}const fr=new FileReader();fr.onload=()=>{try{const o=JSON.parse(fr.result);if(!o||typeof o!=='object'||!o.settings||!Array.isArray(o.clients)||!Array.isArray(o.budgets)||!Array.isArray(o.projects))throw 0;if(!confirm('Restaurar este backup vai substituir os dados atuais do aplicativo. Recomendamos baixar um backup atual antes. Deseja continuar?')){el.value='';return}state=normalize(o);save();render();toast('Backup restaurado. Confira os dados e faça um novo backup.')}catch(err){toast('Arquivo de backup inválido ou incompatível')}finally{el.value=''}};fr.readAsText(file);
  }
});
document.addEventListener('toggle',e=>{const t=e.target;if(t&&t.dataset&&t.dataset.sec)ui.open[t.dataset.sec]=t.open},true);
document.addEventListener('input',e=>{
  const el=e.target;const path=el.dataset&&el.dataset.bind;if(!path||!state)return;
  let v=el.value;
  if(el.hasAttribute('data-num')){v=el.value===''&&el.hasAttribute('data-null')?null:num(el.value)}
  // Ao aprovar um orçamento pela lista, oferece criar a obra já vinculada.
  const approvalMatch = path.match(/^budgets\.([^.]+)\.status$/);
  const previousStatus = approvalMatch ? state.budgets.find(b=>b.id===approvalMatch[1])?.status : null;
  if(!setPath(path,v))return;
  if(approvalMatch && v==='aprovado' && previousStatus!=='aprovado'){
    const budgetId=approvalMatch[1];
    const alreadyLinked=state.projects.some(p=>p.budgetId===budgetId);
    save();
    render();
    if(!alreadyLinked && confirm('Orçamento aprovado! Deseja criar a obra agora?')) ACT.mkproj(budgetId);
    return;
  }
  if(el.hasAttribute('data-paint'))paintTotals();
  if(el.hasAttribute('data-minday')){const m=$('#minday');if(m)m.textContent=brl(num(state.settings.goal)/Math.max(1,num(state.settings.days)))}
  if(el.hasAttribute('data-brandprev')){const b=$('#brandprev');if(b)b.innerHTML=brandPrevHTML()}
  if(el.hasAttribute('data-plabel')){const l=$('#plabel');if(l)l.textContent=num(v)+'%'}
  if(el.hasAttribute('data-rerender')&&el.tagName==='SELECT'){render()}
  if(el.hasAttribute('data-pkq')){const gd=$('#pkgrid');if(gd)gd.innerHTML=pkGridHTML(state.draft)}
  if(el.hasAttribute('data-idx')){const t=$('#idxtile');if(t)t.innerHTML=idxTileHTML()}
  if(el.hasAttribute('data-bxmat')){const e2=$('#bxmatres');if(e2)e2.innerHTML=bxMcRes()}
  if(el.hasAttribute('data-bxprice'))bxMcTotals();
  if(el.hasAttribute('data-obst')){obStUpd(el)}
  if(el.hasAttribute('data-bxplan')){const e4=$('#bxplanres');if(e4)e4.innerHTML=bxPlanRes()}
  if(el.hasAttribute('data-bxrp')){const e3=$('#bxrplist');if(e3)e3.innerHTML=bxRpList()}
  if(!path.startsWith('ui.'))save();
  if(path==='draft.matValue'||path.startsWith('draft.')){const w=$('a.btn.wa');if(w&&ui.tab==='quote')w.href=waLink(docModel(state.draft))}
});

function applyTheme(theme){document.documentElement.dataset.theme=theme;document.documentElement.style.colorScheme=theme;const b=document.getElementById('themeToggle');if(b){b.textContent=theme==='dark'?'☀':'◐';b.title=theme==='dark'?'Ativar tema claro':'Ativar tema escuro';b.setAttribute('aria-label',b.title)}try{localStorage.setItem('canteiro:theme',theme)}catch(e){}}
try{applyTheme(localStorage.getItem('canteiro:theme')||'light')}catch(e){applyTheme('light')}
document.getElementById('themeToggle')?.addEventListener('click',()=>applyTheme(document.documentElement.dataset.theme==='dark'?'light':'dark'));
